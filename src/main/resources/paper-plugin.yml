name: ADM
version: '${version}'
main: com.tecnor.adm.ADMPlugin
description: Advanced Admin Management - Stage 10 Grim Anticheat compatibility
api-version: '1.21'
authors: [voidles02]

dependencies:
  server:
    LuckPerms:
      load: BEFORE
      required: false
      join-classpath: true
    GrimAC:
      load: BEFORE
      required: false
      join-classpath: false

permissions:
  adm.*:
    description: ADM command permissions, bypasses, and hierarchy markers
    default: op
    children:
      adm.admin.*: true
      adm.mod.*: true
      adm.bypass.*: true
      adm.tier.mod: true
      adm.tier.admin: true
      adm.tier.owner: true
      adm.immune: true
      adm.report: true
      adm.hud.*: true
  adm.admin.*:
    description: Administrator and moderator tools
    default: op
    children:
      adm.mod.*: true
      adm.admin.god: true
      adm.admin.god.others: true
      adm.admin.repair: true
      adm.admin.repair.all: true
      adm.admin.clear: true
      adm.admin.clear.others: true
      adm.admin.tpall: true
      adm.admin.tppos: true
      adm.admin.announcement: true
      adm.admin.broadcast: true
      adm.admin.sudo: true
      adm.admin.reload: true
      adm.admin.version: true
      adm.admin.debug: true
      adm.admin.database: true
      adm.admin.endersee: true
      adm.admin.enderedit: true
      adm.admin.invsee: true
      adm.admin.invsee.edit: true
      adm.admin.vanish: true
      adm.admin.vanish.see: true
      adm.vanish.level.1: true
      adm.admin.whois: true
      adm.admin.whois.ip: true
      adm.admin.seen: true
      adm.admin.storage-info: true
      adm.admin.ban: true
      adm.admin.tempban: true
      adm.admin.ipban: true
      adm.admin.unban: true
      adm.admin.history: true
      adm.admin.alts: true
      adm.admin.spy.commands: true
      adm.admin.spy.social: true
      adm.admin.log: true
      adm.admin.cleanup: true
  adm.mod.*:
    description: Moderator tools
    default: op
    children:
      adm.mod.gamemode: true
      adm.mod.gamemode.others: true
      adm.mod.fly: true
      adm.mod.fly.others: true
      adm.mod.speed: true
      adm.mod.speed.others: true
      adm.mod.heal: true
      adm.mod.heal.others: true
      adm.mod.feed: true
