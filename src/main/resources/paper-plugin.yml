      adm.mod.mutechat: true
      adm.mod.slowmode: true
      adm.mod.mute: true
      adm.mod.tempmute: true
      adm.mod.unmute: true
      adm.mod.warn: true
      adm.mod.warnings: true
      adm.mod.clearwarnings: true
      adm.mod.kick: true
      adm.mod.freeze: true
      adm.mod.staffchat: true
      adm.mod.staffmode: true
      adm.mod.reports: true
      adm.mod.reports.claim: true
      adm.mod.reports.close: true
      adm.mod.notify: true
  adm.bypass.*:
    description: All ADM bypasses
    default: op
    children:
      adm.bypass.hierarchy: true
      adm.bypass.mutechat: true
      adm.bypass.slowmode: true
      adm.bypass.freeze: true
  adm.mod.gamemode:
