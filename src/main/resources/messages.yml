vanish:
  help: '<prefix><yellow>Vanish: /vanish on uses your highest allowed level; /vanish off restores visibility; /vanish set LVL selects a level. Bare /vanish toggles. Higher levels are hidden from more staff; viewers need a level at least as high as yours to see you. Your highest permitted level is <max>.</yellow>'
