prefix: '<dark_gray>[<aqua>ADM</aqua>]</dark_gray> '
command:
  help: '<prefix><gray>Commands: /<command> version, reload, debug, storage-info, database, log, cleanup</gray>'
  no-permission: '<prefix><red>You do not have permission to do that.</red>'
  module-unavailable: '<prefix><red>The <module> module is unavailable.</red>'
  version: '<prefix><gray>ADM <aqua><version></aqua> by <aqua><author></aqua>.</gray>'
  debug: '<prefix><gray>Module status:</gray><newline><details>'
  module-status: '<gray><module>: <status></gray>'
  player-only: '<prefix><red>This command needs a player; specify a target where supported.</red>'
  player-not-found: '<prefix><red>Player <target> was not found.</red>'
  hierarchy: '<prefix><red>You cannot target <target>: they are immune or not below your rank.</red>'
  cooldown: '<prefix><yellow>Wait <seconds> seconds before using this command again.</yellow>'
  usage: '<prefix><yellow>Usage: <usage></yellow>'
reload:
  started: '<prefix><gray>Reading settings asynchronously...</gray>'
  busy: '<prefix><yellow>A reload is already running.</yellow>'
  success: '<prefix><green>Settings and messages reloaded.</green>'
  invalid: '<prefix><red>Reload rejected; the previous settings are still active. <error></red>'
