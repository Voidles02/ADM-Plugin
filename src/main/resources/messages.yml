  disabled: '<prefix><green>Vanish disabled.</green>'
  invalid-level: '<prefix><red>That level is not enabled for your role. Your highest permitted level is <max>; use /vanish set LVL with a level you are permitted to use.</red>'
  fake-join: '<yellow><target> joined the game</yellow>'
  fake-quit: '<yellow><target> left the game</yellow>'

